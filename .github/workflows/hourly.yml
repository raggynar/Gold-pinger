name: Hourly Gold Ping

on:
  schedule:
    # Runs at 07 minutes past every hour, UTC (GitHub cron is UTC).
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: gold-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gold pinger
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python gold_bot.py report

      # Self-chain so reports keep coming even if GitHub's cron is delayed.
      - name: Chain next hourly run
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 3540
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            https://api.github.com/repos/raggynar/Gold-pinger/actions/workflows/hourly.yml/dispatches
