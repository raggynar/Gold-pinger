name: Gold Watch - RED alerts + commands

on:
  schedule:
    # Every 5 minutes. Checks Telegram commands + new RED news + gold drops.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: gold-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python gold_bot.py watch

      - name: Save watch state
        continue-on-error: true
        run: |
          git config user.name "GoldBot"
          git config user.email "goldbot@local"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update watch state"
            git pull --rebase origin main || true
            git push || true
          fi

      # Fast self-chain so Telegram commands get answered within ~20s.
      - name: Chain next run (~10s later)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 10
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            https://api.github.com/repos/raggynar/Gold-pinger/actions/workflows/watch.yml/dispatches
